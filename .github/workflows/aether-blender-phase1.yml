name: CROSSFire - AETHER Blender Phase 3 — PBR Collection

on:
  push:
    paths:
      - tools/aether9_blender_phase1.py
      - tools/aether_topology21.py
      - tools/aether_uv22.py
      - tools/aether_uvqa23.py
      - tools/aether_pbr_phase3.py
      - .github/workflows/aether-blender-phase1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aether-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blender-phase1:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout CROSSFire
        uses: actions/checkout@v4

      - name: Install Blender headless
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy python3-pil xvfb xauth libgl1-mesa-dri
          blender --version | head -n 2

      - name: Build Blender source GLB and art preview
        run: |
          mkdir -p build/aether-phase1
          LIBGL_ALWAYS_SOFTWARE=1 PYTHONPATH=/usr/lib/python3/dist-packages xvfb-run -a -s "-screen 0 1600x1000x24" blender -b -t 2 --python tools/aether9_blender_phase1.py -- \
            --output-dir build/aether-phase1

      - name: Validate source asset and export
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, struct
          root = Path("build/aether-phase1")
          blend = root / "aether9-specter-phase1.blend"
          glb = root / "aether9-specter-phase1.glb"
          report = root / "aether9-phase1-report.json"
          assert blend.is_file() and blend.stat().st_size > 1024
          assert blend.read_bytes()[:7] == b"BLENDER"
          assert glb.is_file() and glb.stat().st_size > 1024
          content = glb.read_bytes()
          magic, version, length = struct.unpack_from("<III", content)
          assert magic == 0x46546C67 and version == 2 and length == len(content)
          json_length, json_type = struct.unpack_from("<II", content, 12)
          assert json_type == 0x4E4F534A
          gltf = json.loads(content[20:20+json_length])
          assert len(gltf.get("meshes", [])) > 12
          report_data = json.loads(report.read_text())
          assert report_data["mesh_objects"] >= 75
          assert "BLENDER_WORKBENCH" in report_data["render_engine"]
          manifest_file = root / "aether9-phase1-manifest.json"
          assert manifest_file.is_file(), "Missing Phase 1.4 asset manifest"
          manifest = json.loads(manifest_file.read_text())
          assert manifest["schema"] == "crossfire-aether-art-asset-v1"
          assert manifest["asset_id"] == "AETHER9_SPECTER"
          assert manifest["phase"] == "3.4"
          assert report_data["phase"] == "3.4"
          pbr_file=root/"aether9-phase3-report.json"
          pbr_source=root/"aether9-specter-pbr.blend"
          assert pbr_file.is_file() and pbr_source.is_file()
          assert pbr_source.read_bytes().startswith(b"BLENDER")
          pbr=json.loads(pbr_file.read_text())
          assert pbr["phase"]=="3"
          assert pbr["atlas_resolution"]==2048
          assert pbr["geometric_ao_bake_resolution"]==512
          assert len(pbr["bake_details"])==9
          assert pbr["source_texture_count"]>=45
          assert set(pbr["variants"])=={"midnight","glacier","eclipse"}
          assert manifest["pbr_variants"]=={k:v["glb"] for k,v in pbr["variants"].items()}
          assert report_data["pbr_variants"]==pbr["variants"]
          for name,metrics in pbr["variants"].items():
              image=root/f"aether9-specter-{name}-pbr.png"
              model=root/metrics["glb"]
              assert image.is_file() and image.stat().st_size>8000
              with open(model,"rb") as src:
                  header=src.read(12)
              magic,version,bytelength=struct.unpack("<III",header)
              assert magic==0x46546c67 and version==2 and bytelength==model.stat().st_size
              bindings=metrics["image_bindings"]
              assert bindings["materials"]>=9
              assert bindings["basecolor_materials"]>=9
              assert bindings["normal_materials"]>=9
              assert bindings["occlusion_materials"]>=9
              assert bindings["emissive_materials"]>=2
              from PIL import Image as PILImage
              with PILImage.open(image) as preview:
                  assert preview.width>=900 and preview.height>=500
              print("VALID PBR FINISH",name,model.stat().st_size,bindings)
          from PIL import Image as PILImage
          for role in pbr["bake_details"]:
              texdir=root/"textures"
              for suffix in ["orm","normal"]:
                  tex=texdir/f"aether9_{role}_{suffix}.png"
                  assert tex.is_file()
                  with PILImage.open(tex) as check:
                      assert check.size==(2048,2048)
              assert (texdir/f"aether9_{role}_ao_baked_512.png").is_file()
          print("VALID AETHER PHASE 3",pbr["source_texture_count"],
                len(pbr["variants"]),len(pbr["bake_details"]))
          qa_file=root/"aether9-phase2-uv-quality.json"
          islands_svg=root/"aether9-phase2-islands.svg"
          assert qa_file.is_file() and islands_svg.is_file()
          qa=json.loads(qa_file.read_text())
          assert qa["phase"]=="2.3" and qa["passed"]
          assert qa["source_meshes"]==60
          assert qa["totals"]["uv_islands"]>60
          assert qa["totals"]["overlapping_uv_triangle_pairs"]==0
          assert qa["totals"]["objects_below_padding"]==0
          assert qa["totals"]["uv_triangles"]>=4000
          assert qa["minimum_required_island_padding_px"]>=8
          assert len(qa["families"])==uv_report["material_family_count"] if "uv_report" in locals() else len(qa["families"])==9
          assert report_data["uv_qa_summary"]==qa["totals"]
          assert manifest["uv_qa_summary"]==qa["totals"]
          print("AETHER PHASE 2.3 QA",qa["totals"],"warnings",len(qa["warnings"]))
          uv_file=root / "aether9-phase2-uv.json"
          uv_layout=root / "aether9-phase2-uv-layout.svg"
          assert uv_file.is_file() and uv_layout.is_file()
          uv_report=json.loads(uv_file.read_text())
          assert uv_report["phase"]=="2.2"
          assert uv_report["atlas_resolution"]==2048
          assert uv_report["object_edge_gutter_pixels"]>=8
          assert uv_report["material_family_count"]>=8
          assert uv_report["source_mesh_count"]==60
          assert len(uv_report["objects"])==60
          assert uv_report["total_uv_loops"]>1000
          assert report_data["uv_stats"]["source_mesh_count"]==60
          assert report_data["uv_stats"]["converted_ribbon_uv_meshes"]==15
          assert manifest["uv_material_family_count"]==uv_report["material_family_count"]
          assert manifest["uv_source_mesh_count"]==uv_report["source_mesh_count"]
          # All UV tiles must be disjoint within their own material family.
          for family, record in uv_report["families"].items():
              assert record["object_count"]==len(record["uv_tiles"])
              tiles=list(record["uv_tiles"].items())
              for i,(name,a) in enumerate(tiles):
                  assert all(0<=x<=1 for x in a), name
                  assert a[2]>a[0] and a[3]>a[1], name
                  for other,b in tiles[i+1:]:
                      assert not (min(a[2],b[2])-max(a[0],b[0])>1e-7 and
                                  min(a[3],b[3])-max(a[1],b[1])>1e-7), (name,other)
          textured_meshes=sum(
              1 for mesh in gltf["meshes"]
              for primitive in mesh["primitives"]
              if "TEXCOORD_0" in primitive["attributes"]
          )
          assert textured_meshes>=75, f"Missing GLB UV coordinates ({textured_meshes})"
          print("AETHER PHASE 2.2 UVS",
                uv_report["source_mesh_count"],uv_report["material_family_count"],
                textured_meshes)
          topology_file = root / "aether9-phase2-topology.json"
          assert topology_file.is_file(), "Missing mesh topology inspection"
          topology = json.loads(topology_file.read_text())
          summary = topology["stats"]
          assert topology["phase"] == "2.1"
          assert summary["meshes"] >= 25
          assert summary["triangles_after"] >= 1000
          assert summary["ngons_resolved"] >= 1
          assert summary["vertices_after"] <= summary["vertices_before"]
          assert sum(len(x["before"])>0 for x in topology["objects"].values()) == summary["meshes"]
          for name, detail in topology["objects"].items():
              assert detail["after"]["ngons"] == 0, name
              assert detail["after"]["nonmanifold_edges"] == 0, name
              assert detail["after"]["degenerate_faces"] == 0, name
              assert detail["after"]["loose_vertices"] == 0, name
              assert detail["after"]["signed_volume"] > 0, name
          assert manifest["topology_summary"] == summary
          assert report_data["topology_stats"] == summary
          print("AETHER PHASE 2.1 TOPOLOGY", summary)
          assert len(manifest["groups"]) == 8
          assert len(manifest["objects"]) == report_data["mesh_objects"]
          assert sum(v["object_count"] for v in manifest["groups"].values()) == len(manifest["objects"])
          assert all(v["object_count"] > 0 for v in manifest["groups"].values())
          assert len({obj["id"] for obj in manifest["objects"]}) == len(manifest["objects"])
          node_names = {node.get("name") for node in gltf.get("nodes", [])}
          assert manifest["asset_root"] in node_names, "Missing GLB asset root"
          assert all(v["anchor"] in node_names for v in manifest["groups"].values()), "Missing GLB art group anchors"
          assert len(gltf["meshes"]) >= report_data["mesh_objects"], "GLB export omitted visual meshes"
          print("AETHER PHASE 1.4 SCENE GROUPS", {k:v["object_count"] for k,v in manifest["groups"].items()})
          from PIL import Image
          for name in [
              "aether9-specter-phase1.png",
              "aether9-specter-phase1-profile.png",
              "aether9-specter-phase1-rear.png",
          ]:
              frame = root / name
              assert frame.is_file() and frame.stat().st_size > 3000, name
              with Image.open(frame) as img:
                  assert img.size[0] >= 1024 and img.size[1] >= 640
                  pixels = img.convert("RGB").resize((160,96))
                  colorful = sum(1 for px in pixels.getdata() if max(px)>60)
                  assert colorful>145, f"Blank or near-black preview: {name} ({colorful})"
                  print("VISIBLE REVIEW FRAME", name, colorful)
          print("VALID AETHER PHASE 3 UV FOUNDATION", len(gltf["meshes"]), report_data["mesh_objects"])
          PY

      - name: Install generated game art
        run: |
          mkdir -p art/blender static/assets static/previews
          cp build/aether-phase1/aether9-specter-phase1.blend art/blender/
          cp build/aether-phase1/aether9-specter-phase1.glb static/assets/
          cp build/aether-phase1/aether9-specter-phase1*.png static/previews/
          cp build/aether-phase1/aether9-phase1-report.json art/blender/
          cp build/aether-phase1/aether9-phase1-manifest.json art/blender/
          cp build/aether-phase1/aether9-phase2-topology.json art/blender/
          cp build/aether-phase1/aether9-phase2-uv.json art/blender/
          cp build/aether-phase1/aether9-phase2-uv-quality.json art/blender/
          cp build/aether-phase1/aether9-specter-pbr.blend art/blender/
          cp build/aether-phase1/aether9-phase3-report.json art/blender/
          cp build/aether-phase1/aether9-specter-{midnight,glacier,eclipse}.glb static/assets/
          cp build/aether-phase1/aether9-specter-*-pbr.png static/previews/
          mkdir -p static/textures/aether9
          cp build/aether-phase1/textures/*.png static/textures/aether9/
          cp build/aether-phase1/aether9-phase2-islands.svg static/previews/
          cp build/aether-phase1/aether9-phase2-uv-layout.svg static/previews/

      - name: Commit validated Blender exports
        if: github.ref_name == 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/blender/aether9-specter-phase1.blend \
            art/blender/aether9-phase1-report.json \
            art/blender/aether9-phase1-manifest.json \
            art/blender/aether9-phase2-topology.json \
            art/blender/aether9-phase2-uv.json \
            art/blender/aether9-phase2-uv-quality.json \
            art/blender/aether9-specter-pbr.blend \
            art/blender/aether9-phase3-report.json \
            static/assets/aether9-specter-midnight.glb \
            static/assets/aether9-specter-glacier.glb \
            static/assets/aether9-specter-eclipse.glb \
            static/previews/aether9-specter-midnight-pbr.png \
            static/previews/aether9-specter-glacier-pbr.png \
            static/previews/aether9-specter-eclipse-pbr.png \
            static/previews/aether9-phase2-islands.svg \
            static/previews/aether9-phase2-uv-layout.svg \
            static/assets/aether9-specter-phase1.glb
          git add static/previews/aether9-specter-phase1*.png
          git add static/textures/aether9/*.png
          if ! git diff --cached --quiet; then
            git commit -m "AETHER Phase 3: PBR material maps, AO bake, normals and three cosmetic exports"
            # Another CI or documentation commit can land while Blender runs.
            # Rebase on fresh main instead of dropping a validated export.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Archive Blender output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether9-blender-phase1
          path: build/aether-phase1/
          if-no-files-found: warn
          retention-days: 14
