name: Octavus Phase 1.2 native geometry staging
on:
  push:
    branches: [main]
    paths:
      - "scripts/octavus_native_geometry77.py"
      - "scripts/octavus_native_core78.py"
      - "scripts/audit_octavus_native_spawns78.py"
      - "scripts/decode_octavus_octree76.py"
      - "test_octavus_native_geometry77.py"
      - "sources/octavus.original.mpz"
      - "sources/octavus.original.json"
      - "sources/octavus.native-variables.json"
      - ".github/workflows/octavus-native-phase12.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-native-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assert original cube face and source visibility tests
        run: python -m unittest -v test_octavus_native_geometry77 test_octavus_octree76
      - name: Export source-native geometry to independent staging-only asset
        run: python -m scripts.octavus_native_geometry77
      - name: Verify compressed staging geometry header and payload length
        run: |
          python - <<'PY'
          import gzip,json,hashlib,struct
          from pathlib import Path
          p=Path("static/maps/octavus.native-stage1.bin.gz")
          manifest=json.loads(Path("static/maps/octavus.native-stage1.json").read_text())
          raw=gzip.decompress(p.read_bytes())
          magic,verts,triangles=struct.unpack_from("<4sII",raw)
          assert magic==b"OCN2"
          assert (verts,triangles)==(manifest["vertices"],manifest["triangles"])
          assert len(raw)==12+12*verts+14*triangles
          assert hashlib.sha256(p.read_bytes()).hexdigest()==manifest["stagingSHA256"]
          assert triangles>80000 and verts>20000, (verts,triangles)
          assert manifest["sourceExplicitPolygons"]==49794
          assert manifest["status"]=="staging-only-not-live"
          print("Verified binary OCN2 geometry, triangle provenance and safe staging")
          PY
      - name: Separate native architecture from unculled plain-fill geometry
        run: |
          python -m scripts.octavus_native_core78
          python - <<'PY'
          import gzip,hashlib,json,struct
          from pathlib import Path
          f=Path("static/maps/octavus.native-core.bin.gz")
          m=json.loads(Path("static/maps/octavus.native-core.json").read_text())
          raw=gzip.decompress(f.read_bytes())
          magic,verts,triangles=struct.unpack_from("<4sII",raw)
          assert magic==b"OCN2"
          assert len(raw)==12+verts*12+triangles*14
          assert (verts,triangles)==(m["vertices"],m["triangles"])
          assert 75000<=triangles<=150000
          assert 10000<=verts<=250000
          assert m["excludedTriangles"]+triangles==1661200
          assert sum(int(n) for n in m["triangleMaterials"].values())==triangles
          assert "1" not in m["triangleMaterials"]
          assert hashlib.sha256(f.read_bytes()).hexdigest()==m["sha256"]
          print("OCN2 native architecture verified; plain fill preserved in original staging archive")
          PY
      - name: Cross-check reconstructed surface elevations at original native spawns
        run: |
          python -m scripts.audit_octavus_native_spawns78
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("static/maps/octavus.native-spawn-audit.json").read_text())
          assert a["originalPlayerStartCount"]==33
          assert len(a["spawns"])==33
          assert a["liveMapModified"] is False
          print("Documented native map spawn-to-ground discrepancies:",len(a["outliers"]))
          PY
      - name: Publish reproducible staging-only mesh and audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/maps/octavus.native-stage1.bin.gz static/maps/octavus.native-stage1.json static/maps/octavus.native-core.bin.gz static/maps/octavus.native-core.json static/maps/octavus.native-spawn-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "build(octavus phase1.2): publish native core geometry and full preserved source mesh"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
