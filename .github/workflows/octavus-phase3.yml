name: Octavus Phase 3 multiplayer smoke checks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/octavus-phase3.yml"
      - "octavus_world.py"
      - "dust_motion65.py"
      - "bot57.py"
      - "octavus_nav73.py"
      - "static/dust_motion65.js"
      - "static/octavus_match.js"
      - "static/octavus_preview.js"
      - "static/octavus_props.js"
      - "static/octavus_environment.js"
      - "static/minimap.js"
      - "static/maps/octavus.json"
      - "test_octavus_motion73.py"
      - "test_octavus_motion73.mjs"
      - "scripts/check_browser_imports.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gameplay-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install original multiplayer test requirements
        run: pip install -r requirements.txt
      - name: Validate exact Octavus terrain, motion and safe spawn sources
        run: python -m unittest test_octavus_phase1 test_octavus_motion73 -v
      - name: Verify browser import graph
        run: python scripts/check_browser_imports.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check JavaScript syntax and matched capsule parity
        run: |
          node --check static/game.js
          node --check static/octavus_match.js
          node --check static/octavus_preview.js
          node --check static/octavus_environment.js
          node --check static/octavus_props.js
          node --check static/octavus_decals.js
          node test_octavus_motion73.mjs
      - name: Verify existing multiplayer and default-map regressions
        run: python -m unittest test_server -q
      - name: Commit verified status for visible inspection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          p=Path("static/maps/octavus.phase3-tests.json")
          p.write_text(json.dumps({
            "status":"passed",
            "verifiedAt":datetime.now(timezone.utc).isoformat(),
            "tests":["Octavus mesh and original UVs","Octavus server stairs and ceiling",
                     "Bot line-of-sight","Browser import closure",
                     "Client movement stair and ceiling",
                     "Existing server multiplayer regression suite"],
            "scope":"Automated tests; does not replace interactive browser gameplay"
          },indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/maps/octavus.phase3-tests.json
          git commit -m "test(octavus 3.3): record passing multiplayer and source mesh smoke checks"
          git pull --rebase origin main
          git push origin HEAD:main
