name: Octavus Phase 3 multiplayer smoke checks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/octavus-phase3.yml"
      - "octavus_world.py"
      - "server.py"
      - "static/game.js"
      - "dust_world64.py"
      - "dust_motion65.py"
      - "bot57.py"
      - "octavus_nav73.py"
      - "static/dust_motion65.js"
      - "static/dust_corridor/src/physics/BVH.js"
      - "static/octavus_match.js"
      - "static/octavus_preview.js"
      - "static/octavus_props.js"
      - "static/octavus_environment.js"
      - "static/minimap.js"
      - "static/maps/octavus.json"
      - "test_octavus_motion73.py"
      - "test_octavus_perf74.py"
      - "test_octavus_network75.py"
      - "test_octavus_motion73.mjs"
      - "scripts/check_browser_imports.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gameplay-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install multiplayer test requirements
        run: pip install -r requirements.txt
      - id: pytests
        name: Verify Octavus source, server motion and collision
        run: |
          python -m unittest test_octavus_phase1 test_octavus_motion73 test_octavus_perf74 test_octavus_network75 -v > octavus-py.log 2>&1
          code=$?
          cat octavus-py.log
          exit $code
      - id: imports
        name: Validate browser's complete import graph
        run: python scripts/check_browser_imports.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - id: jstests
        name: Validate module syntax and browser-side capsule parity
        run: |
          node --check static/game.js &&
          node --check static/octavus_match.js &&
          node --check static/octavus_preview.js &&
          node --check static/octavus_environment.js &&
          node --check static/octavus_props.js &&
          node --check static/octavus_decals.js &&
          node --check static/dust_corridor/src/physics/BVH.js &&
          node test_octavus_motion73.mjs > octavus-js.log 2>&1
          code=$?
          if [ -f octavus-js.log ]; then cat octavus-js.log; fi
          exit $code
      - id: servertests
        name: Verify existing multiplayer and default-map regressions
        run: |
          python -m unittest test_server -q > octavus-server.log 2>&1
          code=$?
          cat octavus-server.log
          exit $code
      - name: Persist success or failure diagnostics to main
        if: always()
        env:
          PY_STATUS: ${{ steps.pytests.outcome }}
          IMPORT_STATUS: ${{ steps.imports.outcome }}
          JS_STATUS: ${{ steps.jstests.outcome }}
          SERVER_STATUS: ${{ steps.servertests.outcome }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime,timezone
          steps={key:os.environ.get(env,"skipped")
                 for key,env in [
                   ("octavusServerMotion","PY_STATUS"),
                   ("browserImportClosure","IMPORT_STATUS"),
                   ("octavusClientMotion","JS_STATUS"),
                   ("existingMultiplayer","SERVER_STATUS")
                 ]}
          errors={}
          for name,path in [
            ("python","octavus-py.log"),("javascript","octavus-js.log"),
            ("server","octavus-server.log")
          ]:
            f=Path(path)
            if f.is_file():errors[name]=f.read_text(errors="replace").splitlines()[-28:]
          passed=all(value=="success" for value in steps.values())
          p=Path("static/maps/octavus.phase3-tests.json")
          p.write_text(json.dumps({
            "status":"passed" if passed else "failed",
            "verifiedAt":datetime.now(timezone.utc).isoformat(),
            "steps":steps,
            "logTail":errors,
            "scope":"Automated tests; interactive browser gameplay still requires playtesting"
          },indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/maps/octavus.phase3-tests.json
          if ! git diff --cached --quiet; then
            git commit -m "test(octavus 3.3): record automated gameplay success or failure"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
