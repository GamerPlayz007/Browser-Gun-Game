name: Octavus Phase 1.4 conservative edge-occlusion tests
on:
  push:
    branches: [main]
    paths:
      - "scripts/octavus_native_visibility82.py"
      - "test_octavus_native_visibility82.py"
      - ".github/workflows/octavus-native-visibility82.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-edge-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prove native edge-face culling does not erase octree subdivision openings
        run: python -m unittest -v test_octavus_native_visibility82 test_octavus_native_geometry77
      - name: Prevent promotion of rejected conservative full-mesh experiment
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path("scripts/octavus_native_visibility82.py").read_text()
          assert "def covers_entire_native_face(" in src
          assert "def area_covers_box(" in src
          assert 'stage-only' in src or 'staging' in src
          print("Source edge-face logic tested; full exporter is quarantined.")
          print("It exceeded the 1.8m triangle candidate guard on original MPZ.")
          print("Do not publish or use the experimental mesh in gameplay.")
          PY
