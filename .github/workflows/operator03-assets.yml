name: Build Operator 03 PBR assets
on:
  push:
    branches:
      - feature/operator03-camo-lobby
    paths:
      - tools/build_crossfire_operator_v3.py
      - tools/build_operator03_camo_assets.py
      - .github/workflows/operator03-assets.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-operator-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Operator 03 branch
        uses: actions/checkout@v4
        with:
          ref: feature/operator03-camo-lobby
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mesh and texture dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.1,<3" "scipy>=1.13,<2" "trimesh>=4.4,<5" "pillow>=10,<13"
      - name: Generate original Operator 03 GLB and PBR textures
        run: python tools/build_crossfire_operator_v3.py
      - name: Generate eight camouflage variations
        run: python tools/build_operator03_camo_assets.py
      - name: Verify geometry, pivots, PBR maps and skin atlases
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, struct
          from PIL import Image
          p=Path('static/operators')
          glb=p/'CROSSFire_Operator_03_PBR_Game.glb'
          assert glb.is_file() and glb.stat().st_size>1000000
          raw=glb.read_bytes()
          assert raw[:4]==b'glTF'
          ln,kind=struct.unpack_from('<II',raw,12)
          assert kind==0x4e4f534a
          data=json.loads(raw[20:20+ln])
          assert len(data.get('images',[]))>=3
          names={n.get('name') for n in data['nodes']}
          pivots={'rig_body','head','leg_L','leg_R','knee_L','knee_R','arm_L','arm_R','elbow_L','elbow_R'}
          assert pivots<=names
          patterns=['woodland','desert','urban','arctic','jungle','navy_digital','ranger','shadow']
          for skin in patterns:
              tex=p/f'CROSSFire_Operator_03_{skin}_BaseColor_Atlas.png'
              assert tex.is_file() and tex.stat().st_size>40000
              with Image.open(tex) as image: assert image.size==(1152,1152)
          print('Verified model, PBR texture channels and 8 camouflage variants.')
          PY
      - name: Commit generated runtime assets to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/operators/CROSSFire_Operator_03_PBR_Game.glb
          git add static/operators/CROSSFire_Operator_03_*_BaseColor_Atlas.png
          if git diff --cached --quiet; then
            echo "Generated assets already match Git."
          else
            git commit -m 'Build Operator 03 real game model and eight camouflage textures'
            git push origin HEAD:feature/operator03-camo-lobby
          fi
