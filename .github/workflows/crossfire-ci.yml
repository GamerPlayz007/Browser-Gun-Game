name: CROSSFIRE release checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  javascript-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Python 3.13 for JS↔Python movement parity tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python server dependencies for parity fixtures
        run: pip install -r requirements.txt
      - name: Install locked JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Test client physics, network synchronization, world, and graphics
        run: npm test

  multiplayer-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install server dependencies
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q server.py map_registry.py movement_live.py match35.py modes54.py competitive55.py cosmetics56.py bot57.py perf36.py test_release56.py test_bot57.py
      - name: Test HTTP routes, WebSocket rooms, multiplayer snapshots and map
        run: python -m unittest -v test_server test_map test_release51 test_modes54 test_competitive55 test_release56 test_bot57
