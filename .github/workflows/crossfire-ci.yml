name: CROSSFIRE release checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  javascript-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Python 3.13 for JS↔Python movement parity tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python server dependencies for parity fixtures
        run: pip install -r requirements.txt
      - name: Install locked JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Export original Dust Corridor triangle collision
        run: node scripts/export_dust_collision63.mjs
      - name: Precompile complete Dust Corridor geometry into a compressed spatial scene
        run: node scripts/pack_dust_scene66.mjs
      - name: Verify all original triangles, cloth and props survive scene packing
        run: node test_dust_scene66.mjs
      - name: Verify final Dust Corridor material quality fallback and scene lifecycle
        run: node test_dust_release67.mjs
      - name: Compile deterministic updated map before client regressions
        run: python build_map.py
      - name: Validate source mesh, spawns, Python/JS rays and predicted movement
        run: |
          node test_dust63.mjs
          node scripts/gen_dust_probe64.mjs
          node scripts/gen_dust_replay65.mjs
          python -m unittest -v test_dust_collision63 test_dust64 test_dust65
      - name: Test client physics, network synchronization, world, and graphics
        run: npm test

  multiplayer-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install server dependencies
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q dust_world64.py dust_motion65.py test_dust64.py test_dust65.py server.py map_registry.py movement_live.py match35.py modes54.py competitive55.py cosmetics56.py bot57.py perf36.py combat64.py test_combat64.py maps/daybreak67_density.py test_daybreak67.py test_interface65.py test_release56.py test_bot57.py
      - name: Compile deterministic updated map before server regressions
        run: python build_map.py
      - name: Test HTTP routes, WebSocket rooms, multiplayer snapshots and map
        run: python -m unittest -v test_server test_combat64 test_daybreak67 test_map test_match35 test_release51 test_modes54 test_competitive55 test_interface65 test_release56 test_bot57 test_dust64 test_dust65
