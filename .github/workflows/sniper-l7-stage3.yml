name: CROSSFire L7 Blender Cosmetic Assets
on:
  push:
    branches: [main]
    paths:
      - 'tools/sniper_l7_stage3.py'
      - 'tools/test_sniper_l7_stage3_outputs.py'
      - '.github/workflows/sniper-l7-stage3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export-sniper-art:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and texture dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy python3-pil xvfb xauth libgl1-mesa-dri
          blender --version | head -2
      - name: Export native source to Hero and Performance cosmetic models
        run: |
          mkdir -p build/sniper-l7
          LIBGL_ALWAYS_SOFTWARE=1 PYTHONPATH=/usr/lib/python3/dist-packages xvfb-run -a -s "-screen 0 1280x720x24" blender -b -t 2 --python-exit-code 1 --python tools/sniper_l7_stage3.py -- "$PWD/build/sniper-l7"
      - name: Check real glTF outputs and unchanged source geometry
        run: python3 tools/test_sniper_l7_stage3_outputs.py build/sniper-l7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crossfire-l7-hero-and-performance
          path: build/sniper-l7/CROSSFIRE_L7_*
          if-no-files-found: warn
      - name: Publish validated models to asset library storage
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p static/assets art/blender
          cp build/sniper-l7/CROSSFIRE_L7_*.glb static/assets/
          cp build/sniper-l7/CROSSFIRE_L7_Stage3_Report.json static/assets/
          cp build/sniper-l7/CROSSFIRE_L7_*.blend art/blender/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/assets/CROSSFIRE_L7_*.glb static/assets/CROSSFIRE_L7_Stage3_Report.json art/blender/CROSSFIRE_L7_*.blend
          git diff --cached --quiet && exit 0
          git commit -m "Publish validated AETHER-L7 native cosmetic GLBs"
          git pull --rebase origin main
          git push origin HEAD:main
