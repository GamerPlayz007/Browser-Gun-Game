name: Octavus Phase 1.3 native geometry preview
on:
  push:
    branches: [main]
    paths:
      - "static/octavus-native-preview.js"
      - "static/octavus-native-preview.html"
      - "static/maps/octavus.native-core.*"
      - "static/maps/octavus.native-stage1.*"
      - "static/maps/octavus.native-merged.*"
      - "static/maps/octavus.native-optimized.*"
      - "static/maps/octavus.native-materials87.json"
      - "static/octavus_native_material_preview87.js"
      - "static/octavus_native_scenery88.js"
      - "static/octavus_native_transform89.js"
      - "static/octavus_native_props89.js"
      - "static/octavus_native_decals89.js"
      - "static/octavus_native_decal_project90.js"
      - "static/octavus_native_collision91.js"
      - "static/maps/octavus.native-collision-preflight91.json"
      - "static/octavus_props.js"
      - "static/octavus_decals.js"
      - "static/octavus_environment.js"
      - "static/maps/octavus.props.json"
      - "static/maps/octavus.decals.json"
      - "static/maps/octavus.skybox.json"
      - "static/maps/octavus.native-entities.json"
      - "static/maps/octavus.native-entities.json"
      - "static/maps/octavus.native-spawn-audit.json"
      - "static/maps/octavus.reference-source.png"
      - "test_octavus_native_preview79.mjs"
      - "test_octavus_native_browser80.mjs"
      - ".github/workflows/octavus-native-phase13.yml"
  workflow_dispatch:

permissions:
  contents: read
jobs:
  preview-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse browser preview module as ES module
        run: node --input-type=module --check < static/octavus-native-preview.js
      - name: Parse world-surface decal projector and native decal adapters
        run: |
          node --input-type=module --check < static/octavus_native_decal_project90.js
          node --input-type=module --check < static/octavus_native_decals89.js
          node --input-type=module --check < static/octavus_native_scenery88.js
          node --input-type=module --check < static/octavus_native_collision91.js
      - name: Verify full/core OCN2 assets and standalone preview contract
        run: node test_octavus_native_preview79.mjs
      - name: Verify standalone preview is served as a static asset
        run: |
          python3 -m http.server 8765 --directory . >/tmp/octavus-phase13-http.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID || true' EXIT
          python3 - <<'PY'
          from urllib.request import urlopen
          import time
          for _ in range(30):
              try:
                  with urlopen("http://127.0.0.1:8765/static/octavus-native-preview.html", timeout=3) as r:
                      body=r.read().decode()
                  assert "octavus-native-preview.js" in body
                  break
              except (OSError,TimeoutError):
                  time.sleep(.2)
          else:
              raise RuntimeError("Native standalone preview not served by static host")
          with urlopen("http://127.0.0.1:8765/static/maps/octavus.native-core.bin.gz") as r:
              assert r.read(2)==bytes([0x1f,0x8b])
          print("Octavus native preview + compressed native geometry HTTP: PASS")
          PY

      - name: Install headless Chrome driver library (no app dependency)
        run: npm install --no-save --no-package-lock --ignore-scripts puppeteer-core@24.20.0
      - name: Render reconstructed geometry in actual headless Chrome
        run: |
          python3 -m http.server 8765 --directory . >/tmp/octavus-phase13-browser.log 2>&1 &
          HTTP_PID=$!
          trap 'kill $HTTP_PID || true' EXIT
          node test_octavus_native_browser80.mjs
      - name: Save inspection screenshot for side-by-side review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: octavus-native-core-chrome-preview
          path: |
            /tmp/octavus-native-core-preview.png
            /tmp/octavus-native-side-by-side.png
            /tmp/octavus-native-optimized-preview.png
            /tmp/octavus-native-source-textures-preview.png
            /tmp/octavus-native-source-scenery-preview.png
            /tmp/octavus-native-source-scenery-full.png
            /tmp/octavus-native-geometry-anchors-preview.png
            /tmp/octavus-native-collision-spawn-review.png
          if-no-files-found: ignore
          retention-days: 14
