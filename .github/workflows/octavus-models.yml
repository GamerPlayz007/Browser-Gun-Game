name: Restore original Octavus environmental models

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/octavus-models.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-props:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install model converter
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 trimesh==4.8.3 Pillow==11.3.0
      - name: Convert Octavus native map-model source to GLB
        run: python scripts/package_octavus_models.py
      - name: Commit original source environment models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/maps/octavus_props/ static/maps/octavus.props.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(octavus): restore original decorative model meshes"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
