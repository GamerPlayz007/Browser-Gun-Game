name: Restore original Octavus environmental models

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/octavus-models.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-props:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Archive original Octavus native OBJ models without external Python dependencies
        run: python scripts/package_octavus_obj_sources.py
      - name: Commit original source environment models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/maps/octavus_props/ static/maps/octavus.props.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(octavus): archive original decorative OBJ geometry without conversion loss"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
