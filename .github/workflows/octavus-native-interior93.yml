name: Octavus Stage 2.2 native island interior collision survey
on:
  push:
    branches: [main]
    paths:
      - "scripts/build_octavus_interior93.py"
      - "octavus_native_interior94.py"
      - "octavus_native_collision91.py"
      - "test_octavus_native_interior95.mjs"
      - "static/octavus_native_interior95.js"
      - ".github/workflows/octavus-native-interior93.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  island-interior:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preserve source octree island interior floors and remove solid-solid buried plain faces
        run: python -m scripts.build_octavus_interior93
      - name: Probe all 33 authored source spawns and 700+ interior-floor samples
        run: python octavus_native_interior94.py
      - name: Validate original geometry, source slot-1 recovery and unchanged live map
        run: |
          python - <<'PY'
          import json,gzip,hashlib,struct
          from pathlib import Path
          root=Path("static/maps")
          m=json.loads((root/"octavus.native-interior93.json").read_text())
          q=json.loads((root/"octavus.native-interior-preflight94.json").read_text())
          r=json.loads((root/"octavus.native-optimized.json").read_text())
          packed=(root/"octavus.native-interior93.bin.gz").read_bytes()
          raw=gzip.decompress(packed)
          nv,nt=struct.unpack_from("<II",raw,4)
          assert raw[:4]==b"OCN2"
          assert (nv,nt)==(m["vertices"],m["triangles"])
          assert len(raw)==12+nv*12+nt*14
          assert 50000<nt<r["triangles"]
          assert m["sourceOptimizedSha256"]==r["sha256"]
          assert m["retainedNativeSlotOneTriangles"]>0
          assert m["detailedNativeTriangles"]>0
          assert m["nativeAuthoritativeCollisionReady"] is False
          assert m["liveMapModified"] is False
          assert hashlib.sha256(packed).hexdigest()==m["sha256"]
          assert q["sourceCollisionSHA256"]==m["sha256"]
          assert q["sourceCollisionTriangles"]==nt
          assert q["originalStartsExamined"]==33
          assert q["surveyCounts"]["totalNeighborSamplesInside"]>=600
          assert len(q["float32TriangleSoupSHA256"])==64
          assert q["physicallyCompleteInsideFootprint"] is False
          assert q["liveMapModified"] is False
          live=json.loads((root/"octavus.json").read_text())
          assert live["collisionFormat"]=="OCT1"
          assert live["collisionTriangles"]==86500
          print("Stage 2.2 island geometry preflight PASS:",nt,"source triangles",m["retainedNativeSlotOneTriangles"],"plain source candidates")
          PY
      - name: Check JavaScript source-native candidate matches Python Float32 coordinates
        run: |
          node --input-type=module --check < static/octavus_native_interior95.js
          node test_octavus_native_interior95.mjs
      - name: Regression — legacy 98K candidate and boundary remain unchanged
        run: |
          python -m unittest -v test_octavus_native_boundary92 test_octavus_native_collision91
      - name: Publish separately validated island collision data, never change live gameplay
        run: |
          cp static/maps/octavus.native-interior93.bin.gz /tmp/octavus.native-interior93.bin.gz
          cp static/maps/octavus.native-interior93.json /tmp/octavus.native-interior93.json
          cp static/maps/octavus.native-interior-preflight94.json /tmp/octavus.native-interior-preflight94.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/octavus.native-interior93.* static/maps/
            cp /tmp/octavus.native-interior-preflight94.json static/maps/
            git add static/maps/octavus.native-interior93.* static/maps/octavus.native-interior-preflight94.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "build(octavus stage2.2): publish octree-surveyed native island floor/wall candidate and movement evidence"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
