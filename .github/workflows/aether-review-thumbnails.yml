name: AETHER Blender Phase 1.3 visual review thumbnails

on:
  push:
    branches: [main]
    paths:
      - static/previews/aether9-specter-phase1*.png
      - tools/make_aether_thumbnails.py
      - .github/workflows/aether-review-thumbnails.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install preview image tool
        run: python -m pip install 'Pillow>=10,<13'
      - name: Verify renders and prepare small previews
        run: python tools/make_aether_thumbnails.py
      - name: Publish visual review thumbnails
        if: github.ref_name == 'main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/previews/aether9-specter-phase1*-thumb.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'AETHER 1.3: publish inspected compact Blender review images'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: aether-phase13-review-thumbnails
          path: static/previews/aether9-specter-phase1*-thumb.jpg
          retention-days: 14
