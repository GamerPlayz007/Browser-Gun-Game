name: Build Octavus original-material asset pack

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/octavus-materials.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  original-media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install optimized media pipeline
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Extract and compress original texture references
        run: python scripts/package_octavus_textures.py
      - name: Commit licensed original-material adaptations and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/maps/octavus_assets/ static/maps/octavus.texture-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(octavus): ship optimized original texture channels and source attribution"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
