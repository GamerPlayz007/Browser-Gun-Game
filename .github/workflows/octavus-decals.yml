name: Package original Octavus source decals

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/octavus-decals.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decals:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Restore source-marked environmental decals
        run: python scripts/package_octavus_decals.py
      - name: Commit optimized original decal images and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/maps/octavus_assets/ static/maps/octavus.decals.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(octavus): archive source-authentic decorative decals"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
