name: CROSSFIRE Main Build Gate
on:
  push:
    branches: [main, feature/single-live-city]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Export original Dust Corridor triangle collision
        run: node scripts/export_dust_collision63.mjs
      - name: Precompile complete Dust Corridor geometry into a compressed spatial scene
        run: node scripts/pack_dust_scene66.mjs
      - name: Verify all original triangles, cloth and props survive scene packing
        run: node test_dust_scene66.mjs
      - name: Compile all native multiplayer maps
        run: python build_map.py
      - name: Validate Dust original geometry and cross-language physics
        run: |
          node test_dust63.mjs
          node scripts/gen_dust_probe64.mjs
          node scripts/gen_dust_replay65.mjs
          python -m unittest -v test_dust_collision63 test_dust64 test_dust65
      - name: Python map and multiplayer regressions
        run: python -m unittest test_map test_daybreak67 test_server test_combat64 test_interface65 test_stage31 test_match35 test_stage36
      - name: JavaScript rendering, gameplay and combat regressions
        run: npm test && node test_stage31.mjs
      - name: Measure real loopback WebSocket load at 2, 4 and 8 players
        run: python load36.py --out stage36_loopback_metrics.json
      - name: Install Chromium browser smoke dependencies
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Smoke-test real WebGL, room UI and second WebSocket player
        run: python test_browser36.py
      - name: Smoke-test Dust Corridor original mesh and collision preview
        run: python test_dust_browser63.py
      - name: Smoke-test Dust Corridor live native multiplayer with two players
        run: python test_dust_browser65.py
      - name: Save Phase 3 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crossfire-phase3-release-validation
          path: |
            stage36_loopback_metrics.json
            stage36_chromium_smoke.png
            static/maps/dust_scene66.meta.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish deterministic compiled map to the same branch
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A static/map.json static/maps
          if ! git diff --cached --quiet; then
            git commit -m 'build: synchronize all native maps and packed Dust Corridor scene'
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
