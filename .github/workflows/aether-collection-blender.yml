name: CROSSFire — S9 / W12 / L7 native PBR artwork
on:
  push:
    paths:
      - tools/aether_collection_blender.py
      - .github/workflows/aether-collection-blender.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crossfire-armory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  author-validate-publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install offline Blender authoring dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy python3-pil xvfb xauth libgl1-mesa-dri
          blender --version | head -n 2
      - name: Validate source syntax and game module syntax
        run: |
          python3 -m py_compile tools/aether_collection_blender.py
          node --check static/aether-armory.js
          node --check static/static-cosmetic.js
          node --check static/game.js
      - name: Build nine texture-mapped Blender GLBs and review renders
        run: |
          mkdir -p build/aether-armory
          LIBGL_ALWAYS_SOFTWARE=1 PYTHONPATH=/usr/lib/python3/dist-packages xvfb-run -a -s "-screen 0 1440x900x24" \
            blender -b -t 2 --python-exit-code 1 --python tools/aether_collection_blender.py -- "$PWD/build/aether-armory"
      - name: Validate standalone glTF geometry, textures and independent silhouettes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import struct,json
          root=Path("build/aether-armory")
          stats={}
          for weapon in ("s9","w12","l7"):
              blend=root/f"aether-{weapon}.blend"
              assert blend.read_bytes().startswith(b"BLENDER"), blend
              manifest=json.loads((root/f"aether-{weapon}-report.json").read_text())
              assert manifest["mesh_parts"]>=55,manifest
              per_weapon=[]
              for skin in ("midnight","glacier","eclipse"):
                  name=f"aether-{weapon}-{skin}"
                  binary=(root/(name+".glb")).read_bytes()
                  magic,version,length=struct.unpack_from("<III",binary)
                  assert (magic,version,length)==(0x46546c67,2,len(binary)),name
                  count,kind=struct.unpack_from("<II",binary,12)
                  assert kind==0x4e4f534a,name
                  doc=json.loads(binary[20:20+count])
                  assert len(doc.get("meshes",[]))>=55,(name,len(doc.get("meshes",[])))
                  assert len(doc.get("materials",[]))>=7,name
                  assert len(doc.get("images",[]))>=7,name
                  assert any("normalTexture" in m for m in doc["materials"]),name
                  assert any("baseColorTexture" in m["pbrMetallicRoughness"] for m in doc["materials"]),name
                  assert len(doc.get("accessors",[]))>=55,name
                  with Image.open(root/(name+".png")) as im:
                      assert im.width>=1000 and im.height>=600,name
                  per_weapon.append(len(binary))
              stats[weapon]={"meshes":manifest["mesh_parts"],"bytes":per_weapon}
          # Independent geometry, rather than a single AR with recolored materials.
          assert len({s["meshes"] for s in stats.values()})>=2,stats
          print("VALID AETHER COLLECTION",json.dumps(stats,indent=2))
          PY
      - name: Upload rendered proof and source art
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crossfire-aether-armory-native-models
          path: |
            build/aether-armory/aether-*.glb
            build/aether-armory/aether-*.png
            build/aether-armory/aether-*.blend
            build/aether-armory/aether-*-report.json
          if-no-files-found: warn
      - name: Publish verified GLB assets and previews
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p static/assets static/previews art/blender
          cp build/aether-armory/aether-*.glb static/assets/
          cp build/aether-armory/aether-*.png static/previews/
          cp build/aether-armory/aether-*-report.json static/assets/
          cp build/aether-armory/aether-*.blend art/blender/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/assets/aether-*.glb static/assets/aether-*-report.json static/previews/aether-*.png art/blender/aether-*.blend
          git diff --cached --quiet && exit 0
          git commit -m "Publish reviewed native PBR armory artwork"
          git pull --rebase origin main
          git push origin HEAD:main
