name: Archived original Neon Zenith reference (manual only)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify first-party native CROSSFIRE map is shipped
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('static/maps')
          registry=json.loads((root/'index.json').read_text())
          neon=json.loads((root/'neon_zenith.json').read_text())
          assert neon['engine']=='crossfire-webgl'
          assert any(m['id']=='neon_zenith' and m['available'] for m in registry['maps'])
          assert len(neon['spawns'])>=8
          assert len(neon['boxes'])>100
          print('Original city layout imported into CROSSFIRE WebGL successfully.')
          PY
