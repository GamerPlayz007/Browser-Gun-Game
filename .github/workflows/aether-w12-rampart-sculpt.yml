name: CROSSFire — RAMPART W12 sculpt review
on:
  push:
    paths:
      - tools/aether_w12_rampart_sculpt.py
      - .github/workflows/aether-w12-rampart-sculpt.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crossfire-rampart-sculpt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sculpt-clay-midnight:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender review renderer
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender xvfb xauth libgl1-mesa-dri python3-pil python3-numpy
          blender --version | head -n 2
      - name: Validate script syntax
        run: python3 -m py_compile tools/aether_w12_rampart_sculpt.py
      - name: Sculpt original RAMPART geometry and render clay / Midnight comparisons
        run: |
          mkdir -p build/aether-w12-rampart
          LIBGL_ALWAYS_SOFTWARE=1 PYTHONPATH=/usr/lib/python3/dist-packages xvfb-run -a -s "-screen 0 1600x960x24" \
            blender -b -t 2 --python-exit-code 1 --python tools/aether_w12_rampart_sculpt.py -- "$PWD/build/aether-w12-rampart"
      - name: Validate source, GLB structure, reviews, and material lineage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, struct
          root=Path("build/aether-w12-rampart")
          report=json.loads((root/"aether-w12-rampart-sculpt-report.json").read_text())
          assert report["old_w12_replaced"] is False
          assert report["nonfunctional_fictional_game_art"] is True
          assert report["mesh_objects"]>=45,report
          assert len(report["material_families"])==9,report
          blend=(root/"aether-w12-rampart-sculpt.blend").read_bytes()
          assert blend.startswith(b"BLENDER"),"missing editable .blend"
          raw=(root/"aether-w12-rampart-sculpt.glb").read_bytes()
          magic,version,length=struct.unpack_from("<III",raw)
          assert (magic,version,length)==(0x46546c67,2,len(raw)),"invalid GLB header"
          json_size,kind=struct.unpack_from("<II",raw,12)
          assert kind==0x4e4f534a
          doc=json.loads(raw[20:20+json_size])
          assert len(doc["meshes"])>=45
          assert len(doc["materials"])>=8
          assert len(doc["nodes"])>=45
          for finish in ("clay","midnight"):
            for view in ("hero","profile"):
              p=root/("aether-w12-rampart-"+finish+"-"+view+".png")
              assert p.stat().st_size>50000,p
              with Image.open(p) as im:
                assert im.size==(1360,820), (p,im.size)
          print("RAMPART SCULPT REVIEW VALID",json.dumps({"meshes":len(doc["meshes"]),"materials":len(doc["materials"]),"glb_bytes":len(raw)}))
          PY
      - name: Upload sculpt, source, renders for review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crossfire-w12-rampart-sculpt-review
          path: build/aether-w12-rampart/aether-w12-rampart-*
          if-no-files-found: warn
      - name: Publish isolated review files (do not touch game SMG or AR)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p static/assets static/previews art/blender
          cp build/aether-w12-rampart/aether-w12-rampart-sculpt.glb static/assets/
          cp build/aether-w12-rampart/aether-w12-rampart-sculpt-report.json static/assets/
          cp build/aether-w12-rampart/aether-w12-rampart-*.png static/previews/
          cp build/aether-w12-rampart/aether-w12-rampart-sculpt.blend art/blender/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/assets/aether-w12-rampart-sculpt* static/previews/aether-w12-rampart-* art/blender/aether-w12-rampart-sculpt.blend
          git diff --cached --quiet && exit 0
          git commit -m "Publish new W12 RAMPART clay and Midnight sculpt for design review"
          git pull --rebase origin main
          git push origin HEAD:main
