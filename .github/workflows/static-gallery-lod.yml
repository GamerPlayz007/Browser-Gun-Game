name: Static gallery LOD and final asset QA
on:
  push:
    branches: [main]
    paths:
      - tools/static_glb_lod.py
      - tools/glb_texture_profiles.py
      - tools/test-static-gallery-batching.mjs
      - static/static-gallery-batching.js
      - .github/workflows/static-gallery-lod.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender
          python -m pip install Pillow==11.3.0
          mkdir -p node_modules
          ln -s ../static/vendor node_modules/three
          printf '%s\n' '{"type":"module","main":"./three.module.js"}' > static/vendor/package.json
      - name: Check source and synthetic fixtures
        run: |
          node --check static/aether9-pbr-showroom.js
          node --check static/static-gallery-batching.js
          node tools/test-static-gallery-batching.mjs
          python -m py_compile tools/static_glb_lod.py tools/glb_texture_profiles.py
          python tools/glb_texture_profiles.py --self-test
          blender -b -t 2 --python-exit-code 1 --python tools/static_glb_lod.py -- --out-dir /tmp/gallery-fixtures --self-test
      - name: Build candidate LOD copies
        run: |
          blender -b -t 2 --python-exit-code 1 --python tools/static_glb_lod.py -- --out-dir /tmp/gallery-lods static/assets/aether9-specter-midnight.glb static/assets/aether9-specter-glacier.glb static/assets/aether9-specter-eclipse.glb
      - name: Collect candidate assets for review
        uses: actions/upload-artifact@v4
        with:
          name: static-gallery-lod-candidates
          path: /tmp/gallery-lods/
          if-no-files-found: error
          retention-days: 14
