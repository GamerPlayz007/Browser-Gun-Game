name: AETHER Phase 3 — Real GLB PBR Preview QA

on:
  push:
    branches: [main]
    paths:
      - tools/aether_pbr_preview.py
      - .github/workflows/aether-pbr-preview.yml
      - static/assets/aether9-specter-midnight.glb
      - static/assets/aether9-specter-glacier.glb
      - static/assets/aether9-specter-eclipse.glb
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aether-pbr-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio-qa:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and image inspection packages
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender python3-numpy python3-pil xvfb xauth libgl1-mesa-dri

      - name: Render real exported PBR GLBs in fresh studio
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 PYTHONPATH=/usr/lib/python3/dist-packages xvfb-run -a -s "-screen 0 1600x1000x24" blender -b -t 2 --python tools/aether_pbr_preview.py -- \
            --asset-dir static/assets --out-dir static/previews

      - name: Assert all three actual rendered assets are visible and distinct
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageChops, ImageStat
          from pathlib import Path
          import json
          root=Path("static/previews")
          stats=json.loads((root/"aether9-pbr-visual-qa.json").read_text())
          assert set(stats)=={"midnight","glacier","eclipse"}
          skins=list(stats)
          imgs=[]
          for name in skins:
              data=stats[name]
              assert data["imported_meshes"]>=70
              assert data["visible_pixels"]>10000
              assert data["mean_lit_rgb"]>17
              source=root/f"aether9-specter-{name}-pbr.png"
              assert source.stat().st_size>20000
              im=Image.open(source).convert("RGB")
              assert im.size==(1152,720)
              imgs.append(im)
          for i in range(3):
              for j in range(i+1,3):
                  difference=ImageStat.Stat(ImageChops.difference(imgs[i],imgs[j]))
                  assert sum(difference.mean)/3>2, (skins[i],skins[j],difference.mean)
          print("AETHER PHASE 3 PREVIEW QA PASSED",stats)
          PY

      - name: Commit validated PBR previews and visibility report
        if: github.ref_name == 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/previews/aether9-specter-*-pbr.png static/previews/aether9-pbr-visual-qa.json
          if ! git diff --cached --quiet; then
            git commit -m "AETHER Phase 3: publish visually verified true PBR studio renders"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Save review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-phase3-verified-pbr-renders
          path: |
            static/previews/aether9-specter-*-pbr.png
            static/previews/aether9-pbr-visual-qa.json
          retention-days: 14
