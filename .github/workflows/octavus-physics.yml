name: Octavus physics regression tests

on:
  push:
    paths:
      - 'dust_motion65.py'
      - 'dust_world64.py'
      - 'octavus_world.py'
      - 'static/dust_motion65.js'
      - 'tests/test_octavus_*.py'
      - 'static/octavus_match.js'
      - 'static/octavus_boundary.js'
      - 'static/octavus_culling.js'
      - 'static/octavus_texture_budget.js'
      - 'static/octavus_preview.js'
      - 'static/octavus_materials.js'
      - 'static/octavus_props.js'
      - 'static/octavus_prop_lod.js'
      - 'static/maps/octavus.props.json'
      - 'static/maps/octavus.native-entities.json'
      - 'static/maps/octavus.original.cfg'
      - 'tests/test_octavus_prop_models.mjs'
      - 'tests/test_octavus_render.mjs'
      - 'static/maps/octavus.json'
      - '.github/workflows/octavus-physics.yml'
  workflow_dispatch:

jobs:
  verify-octavus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python movement modules
        run: python -m py_compile dust_motion65.py dust_world64.py octavus_world.py
      - name: Run Octavus movement regressions
        run: python -m unittest discover -s tests -p 'test_octavus_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse matching client physics
        run: |
          node --check static/dust_motion65.js
          node --check static/octavus_match.js
          node --check static/octavus_boundary.js
          node --check static/octavus_culling.js
          node --check static/octavus_texture_budget.js
          node --check static/octavus_materials.js
          node --check static/octavus_preview.js
          node --check static/octavus_props.js
          node --check static/octavus_prop_lod.js
      - name: Install real Three.js for source model checks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test Octavus visual crop and original model instancing
        run: node --test tests/test_octavus_render.mjs tests/test_octavus_prop_models.mjs
