name: CROSSFIRE Phase 3.1 Integration
on:
  push:
    branches: [feature/phase-3-1-integration]
  pull_request:
    paths:
      - 'maps/**'
      - 'build_map.py'
      - 'static/world.js'
      - 'static/stage*_visual_layer.js'
      - 'test_stage31.py'
      - '.github/workflows/phase31-integration.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Production 02.5 regression suite
        run: |
          python build_map.py
          python -m unittest test_map test_server
          npm test
      - name: Build optional new city
        run: CROSSFIRE_STAGE31=1 python build_map.py
      - name: Validate native Python arena registry and renderer
        run: |
          CROSSFIRE_STAGE31=1 python -m unittest test_stage31
          node test_stage31.mjs
