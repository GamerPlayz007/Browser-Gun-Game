name: CROSSFIRE Phase 3.1 Integration
on:
  push:
    branches: [feature/phase-3-1-integration]
  pull_request:
    paths:
      - 'maps/**'
      - 'build_map.py'
      - 'static/world.js'
      - 'static/stage*_visual_layer.js'
      - 'test_stage31.py'
      - '.github/workflows/phase31-integration.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Production 02.5 regression suite
        run: |
          python build_map.py
          python -m unittest test_map test_server
          npm test
      - name: Build optional new city
        run: CROSSFIRE_STAGE31=1 python build_map.py
      - name: Validate native Python arena registry and renderer
        run: |
          CROSSFIRE_STAGE31=1 python -m unittest test_stage31
          node test_stage31.mjs
      - name: Commit deployable experimental map assets on branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/phase-3-1-integration'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/maps/cyberpunk-next.json static/maps/index.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(stage31): ship generated opt-in arena for Render'
            git push origin HEAD:feature/phase-3-1-integration
          fi
